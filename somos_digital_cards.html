<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeClever - Somos Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    font-family: 'Nunito', Arial, Helvetica, sans-serif;
  }
  #stage {
    background: #003F2E;
    padding: 56px 40px;
    box-sizing: border-box;
  }
  #inner {
    max-width: 1040px;
    margin: 0 auto;
  }
  h1 {
    color: #FFFFFF;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.4;
    text-align: center;
    margin: 0 0 44px;
  }
  #cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .card {
    background: #00593E;
    border: 1px solid rgba(182, 254, 128, 0.25);
    border-radius: 16px;
    padding: 30px 24px;
    flex: 1;
    min-width: 210px;
    max-width: 250px;
    text-align: center;
    box-sizing: border-box;
  }
  .card .icon-wrap {
    width: 52px;
    height: 52px;
    margin: 0 auto 22px;
  }
  .card .icon-wrap svg {
    width: 100%;
    height: 100%;
  }
  .card p {
    color: #FFFFFF;
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
  }

  @media (max-width: 720px) {
    #stage { padding: 40px 20px; }
    h1 { font-size: 24px; margin-bottom: 32px; }
    #cards { flex-direction: column; align-items: center; }
    .card { max-width: 320px; width: 100%; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="inner">

    <h1>Somos digital. Trabalhar remoto na WeClever é:</h1>

    <div id="cards">

      <div class="card">
        <div class="icon-wrap">
          <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="20" r="7" fill="none" stroke="#B6FE80" stroke-width="3"/>
            <circle cx="36" cy="32" r="7" fill="#B6FE80"/>
            <line x1="21" y1="24" x2="31" y2="28" stroke="#B6FE80" stroke-width="2.5" stroke-dasharray="1 5"/>
          </svg>
        </div>
        <p>Ter conexão humana viva, mesmo à distância.</p>
      </div>

      <div class="card">
        <div class="icon-wrap">
          <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="12" width="24" height="17" rx="3" fill="none" stroke="#B6FE80" stroke-width="3"/>
            <rect x="20" y="24" width="24" height="17" rx="3" fill="#B6FE80"/>
            <path d="M 27 30 l 5 4 l 5 -4" fill="none" stroke="#00593E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p>Colaborar de perto e construir relação.</p>
      </div>

      <div class="card">
        <div class="icon-wrap">
          <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="11" fill="none" stroke="#B6FE80" stroke-width="3"/>
            <circle cx="26" cy="26" r="2.5" fill="#B6FE80"/>
            <line x1="26" y1="8" x2="26" y2="14" stroke="#B6FE80" stroke-width="3" stroke-linecap="round"/>
            <line x1="26" y1="38" x2="26" y2="44" stroke="#B6FE80" stroke-width="3" stroke-linecap="round"/>
            <line x1="8" y1="26" x2="14" y2="26" stroke="#B6FE80" stroke-width="3" stroke-linecap="round"/>
            <line x1="38" y1="26" x2="44" y2="26" stroke="#B6FE80" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <p>Ter liberdade pra trabalhar de onde você quiser.</p>
      </div>

      <div class="card">
        <div class="icon-wrap">
          <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="10" width="36" height="24" rx="3" fill="none" stroke="#B6FE80" stroke-width="3"/>
            <line x1="8" y1="18" x2="44" y2="18" stroke="#B6FE80" stroke-width="3"/>
            <circle cx="14" cy="14" r="1.4" fill="#B6FE80"/>
            <circle cx="19" cy="14" r="1.4" fill="#B6FE80"/>
            <line x1="20" y1="42" x2="32" y2="42" stroke="#B6FE80" stroke-width="3" stroke-linecap="round"/>
            <line x1="26" y1="34" x2="26" y2="42" stroke="#B6FE80" stroke-width="3"/>
          </svg>
        </div>
        <p>Ter o ambiente virtual como o nosso escritório.</p>
      </div>

    </div>
  </div>
</div>

</body>
</html>
