<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WeClever - Sobre Nós</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    font-family: 'Nunito', Arial, Helvetica, sans-serif;
  }
  #wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }
  #dots {
    position: relative;
    width: 785px;
    height: 720px;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
    animation: floaty 3s ease-in-out infinite;
    transition: transform 0.15s;
  }
  .dot.clickable {
    cursor: pointer;
    font-size: 22px;
    font-weight: 600;
    padding: 10px;
    text-decoration: none;
  }
  .dot.clickable:hover {
    transform: scale(1.08);
  }
  @keyframes floaty {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -22px; }
  }
</style>
</head>
<body>

<div id="wrapper">
  <div id="dots"></div>
</div>

<script>
/* ==========================================================
   INSTRUÇÕES:
   Troque cada "url: '#'" abaixo pelo link real da página
   correspondente no seu Google Sites antes de publicar.
   ========================================================== */

const dots = [
  { x:591.1, y:446.6, r:65.7, color:'#01A972', topic:'Somos Digital',        url:'#' },
  { x:208.3, y:446.6, r:65.5, color:'#01A972', topic:'Identidade da Marca', url:'#' },
  { x:686.8, y:256.8, r:65.3, color:'#01A972', topic:'Como nos Comunicamos', url:'#' },
  { x:112.6, y:256.8, r:65.3, color:'#01A972', topic:'Nosso Produto',        url:'#' },
];

const decorative = [
  { x:399.7, y:446.6, r:65.7, color:'#B6FE80' },
  { x:304.0, y:256.8, r:65.5, color:'#B6FE80' },
  { x:495.4, y:256.8, r:65.7, color:'#B6FE80' },
  { x:304.0, y:634.7, r:65.3, color:'#B6FE80' },
  { x:495.4, y:634.7, r:65.3, color:'#B6FE80' },
  { x:144.0, y:601.7, r:33.2, color:'#B6FE80' },
  { x:655.5, y:601.7, r:33.5, color:'#B6FE80' },
  { x:51.5,  y:413.6, r:31.5, color:'#B6FE80' },
  { x:751.1, y:413.6, r:33.2, color:'#B6FE80' },
  { x:239.6, y:101.7, r:33.2, color:'#B6FE80' },
  { x:559.7, y:101.7, r:33.3, color:'#B6FE80' },
  { x:399.7, y:68.7,  r:65.0, color:'#B6FE80' },
];

const container = document.getElementById('dots');
let delay = 0;

function darkText(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b);
  return lum > 150 ? '#003F2E' : '#B6FE80';
}

decorative.forEach((d) => {
  const el = document.createElement('div');
  el.className = 'dot';
  el.style.left = (d.x - d.r) + 'px';
  el.style.top = (d.y - d.r) + 'px';
  el.style.width = (d.r*2) + 'px';
  el.style.height = (d.r*2) + 'px';
  el.style.background = d.color;
  el.style.animationDelay = delay + 's';
  delay += 0.15;
  container.appendChild(el);
});

dots.forEach((d) => {
  const el = document.createElement('a');
  el.href = d.url;
  el.className = 'dot clickable';
  el.setAttribute('aria-label', d.topic);
  el.style.left = (d.x - d.r) + 'px';
  el.style.top = (d.y - d.r) + 'px';
  el.style.width = (d.r*2) + 'px';
  el.style.height = (d.r*2) + 'px';
  el.style.background = d.color;
  el.style.color = '#003F2E';
  el.style.animationDelay = delay + 's';
  delay += 0.15;
  el.textContent = d.topic;
  container.appendChild(el);
});
</script>

</body>
</html>
