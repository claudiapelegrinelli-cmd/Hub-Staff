<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WeClever - Sobre Nós</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #003F2E;
    font-family: 'Nunito', Arial, Helvetica, sans-serif;
  }
  #frame {
    box-sizing: border-box;
    border: 1px solid rgba(182, 254, 128, 0.35);
    border-radius: 24px;
    padding: 6%;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrapper {
    width: 100%;
  }
  #dots {
    position: relative;
    width: 100%;
    padding-bottom: 100%; /* canvas quadrado */
    height: 0;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
    animation: floaty 3s ease-in-out infinite;
    transition: transform 0.15s;
  }
  .dot.clickable {
    cursor: pointer;
    font-size: clamp(9px, 2.4vw, 14px);
    font-weight: 600;
    padding: 4%;
    text-decoration: none;
    white-space: pre-line;
    box-sizing: border-box;
    box-shadow: 0 0 0 6px #01A972;
  }
  .dot.clickable:hover {
    transform: scale(1.08);
  }
  @keyframes floaty {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -3%; }
  }
</style>
</head>
<body>

<div id="frame">
  <div id="wrapper">
    <div id="dots"></div>
  </div>
</div>

<script>
/* ==========================================================
   INSTRUÇÕES:
   Troque cada "url: '#'" abaixo pelo link real da página
   correspondente no seu Google Sites antes de publicar.
   ========================================================== */

const dots = [
  { x:300, y:120, r:110, color:'#B6FE80', topic:'Somos\nDigital',        url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/1mOeT-Z1y8yscaOSyoF3dmsnECfjSGew1/edit' },
  { x:120, y:320, r:110, color:'#B6FE80', topic:'Identidade\nda Marca', url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/1e0ogYEdw3edX-UvlXRw7ObZB_-PVjyUf/edit' },
  { x:300, y:500, r:110, color:'#B6FE80', topic:'Como nos\nComunicamos', url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/1GQaA5no4xaykrW9ooQVODr3VJ_lRsW72/edit' },
  { x:480, y:320, r:110, color:'#B6FE80', topic:'Nosso\nProduto',        url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/1jEsZ4RUdf9Yfo_ToByRsCDoq63Ar8bTY/edit' },
];

const decorative = [];

const CANVAS_W = 600;
const CANVAS_H = 600;
const container = document.getElementById('dots');
let delay = 0;

function pct(val, total) {
  return (val / total * 100) + '%';
}

function darkText(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b);
  return lum > 150 ? '#003F2E' : '#B6FE80';
}

decorative.forEach((d) => {
  const el = document.createElement('div');
  el.className = 'dot';
  el.style.left = pct(d.x - d.r, CANVAS_W);
  el.style.top = pct(d.y - d.r, CANVAS_H);
  el.style.width = pct(d.r*2, CANVAS_W);
  el.style.height = pct(d.r*2, CANVAS_H);
  el.style.background = d.color;
  el.style.animationDelay = delay + 's';
  delay += 0.15;
  container.appendChild(el);
});

dots.forEach((d) => {
  const el = document.createElement('a');
  el.href = d.url;
  el.className = 'dot clickable';
  el.setAttribute('aria-label', d.topic);
  el.style.left = pct(d.x - d.r, CANVAS_W);
  el.style.top = pct(d.y - d.r, CANVAS_H);
  el.style.width = pct(d.r*2, CANVAS_W);
  el.style.height = pct(d.r*2, CANVAS_H);
  el.style.background = d.color;
  el.style.color = '#003F2E';
  el.style.animationDelay = delay + 's';
  delay += 0.15;
  el.textContent = d.topic;
  container.appendChild(el);
});
</script>

</body>
</html>
