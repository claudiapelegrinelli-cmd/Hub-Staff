<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeClever - Saúde Ocupacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    font-family: 'Nunito', Arial, Helvetica, sans-serif;
  }
  #stage {
    position: relative;
    overflow: hidden;
    padding: 48px 40px;
    box-sizing: border-box;
  }
  .deco {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: floaty ease-in-out infinite;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }
  #content {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
  }
  p {
    color: #00593E;
    font-size: 16px;
    line-height: 1.8;
    margin: 0 0 24px;
  }
  .highlight {
    background: #ECFDF3;
    border-radius: 16px;
    padding: 24px 28px;
    margin: 8px 0 0;
  }
  .highlight p.cta-title {
    color: #003F2E;
    font-weight: 800;
    font-size: 17px;
    margin: 0 0 10px;
  }
  .highlight p.cta-body {
    color: #00593E;
    font-size: 15px;
    line-height: 1.7;
    margin: 0 0 18px;
  }
  .cta-button {
    display: inline-block;
    background: #01A972;
    color: #FFFFFF !important;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    border-radius: 999px;
    padding: 12px 28px;
    transition: background 0.2s;
  }
  .cta-button:hover {
    background: #00593E;
  }

  @media (max-width: 560px) {
    #stage { padding: 32px 20px; }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="deco" style="width:80px; height:80px; background:#01A972; opacity:0.4; top:-20px; right:60px; animation-duration:5s;"></div>
  <div class="deco" style="width:45px; height:45px; background:#B6FE80; opacity:0.4; top:220px; right:20px; animation-duration:4s; animation-delay:0.6s;"></div>
  <div class="deco" style="width:30px; height:30px; background:#01A972; opacity:0.4; top:420px; left:20px; animation-duration:4.5s; animation-delay:1s;"></div>
  <div class="deco" style="width:60px; height:60px; background:#B6FE80; opacity:0.35; bottom:60px; left:-10px; animation-duration:5.5s; animation-delay:0.3s;"></div>

  <div id="content">

    <div class="highlight">
      <p class="cta-title">Chegou a hora de colocar o conteúdo à prova!</p>
      <p class="cta-body">Depois de ler o material acima, faça a Avaliação de Fixação de Conteúdo — NR17 (Ergonomia). É rapidinho, e ao concluir você já garante seu certificado.</p>
      <a class="cta-button" href="avaliacao_saude_ocupacional.html" target="_blank">Fazer a avaliação →</a>
    </div>

  </div>
</div>

</body>
</html>
