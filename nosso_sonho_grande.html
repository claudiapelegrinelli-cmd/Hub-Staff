<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nosso Sonho Grande</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .sonho-section {
    position: relative;
    overflow: hidden;
    padding: 64px 48px;
    text-align: center;
    background: #ECFDF3;
    border-radius: 24px;
    max-width: 820px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0, 63, 46, 0.08);
  }

  .sonho-kicker {
    position: relative;
    z-index: 1;
    font-size: 18px;
    font-weight: 700;
    color: #00593E;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .sonho-highlight {
    position: relative;
    z-index: 1;
    display: inline-block;
    max-width: 780px;
    font-size: 40px;
    font-weight: 800;
    line-height: 1.25;
    color: #003F2E;
    margin: 0 auto;
  }

  @media (max-width: 640px) {
    .sonho-highlight { font-size: 28px; }
    .sonho-section { padding: 40px 24px; border-radius: 18px; }
  }
</style>
</head>
<body>

<section class="sonho-section">
  <div class="sonho-kicker">Nosso sonho grande</div>
  <h2 class="sonho-highlight">Revelar o valor de toda conversa.</h2>
</section>

</body>
</html>
