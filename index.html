<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WeClever - Capa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #003F2E;
    font-family: 'Nunito', Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  #wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }
  #canvasBox {
    position: relative;
    width: 620px;
    height: 566px;
    flex-shrink: 0;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    background: #B6FE80;
    animation: floaty ease-in-out infinite;
  }
  @keyframes floaty {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -16px; }
  }
  h1 {
    position: absolute;
    left: 0;
    right: 0;
    color: #EAF6F1;
    font-size: 24px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.3px;
    text-align: center;
    line-height: 1;
  }
</style>
</head>
<body>

<div id="wrapper">
  <div id="canvasBox"></div>
</div>

<script>
// Coordenadas extraídas diretamente do arquivo oficial da logo
// (posição, raio e opacidade reais, na escala original 231x201)
// Geometria 100% fiel ao original — sem nenhum deslocamento.
const rawDots = [
  { x:86.7,  y:20.3,  r:19.0, o:0.5 },
  { x:144.7, y:20.3,  r:19.0, o:0.5 },
  { x:38.4,  y:30.0,  r:9.2,  o:0.5 },
  { x:193.0, y:30.0,  r:9.2,  o:0.5 },
  { x:57.7,  y:77.4,  r:19.5, o:1.0 },
  { x:115.7, y:77.4,  r:19.5, o:1.0 },
  { x:173.7, y:77.4,  r:19.5, o:1.0 },
  { x:9.3,   y:87.3,  r:9.5,  o:0.5 },
  { x:222.1, y:87.3,  r:9.5,  o:0.5 },
  { x:28.7,  y:134.6, r:19.2, o:0.5 },
  { x:86.7,  y:134.6, r:19.5, o:1.0 },
  { x:144.7, y:134.6, r:19.5, o:1.0 },
  { x:202.7, y:134.6, r:19.2, o:0.5 },
  { x:67.4,  y:182.0, r:9.2,  o:0.5 },
  { x:164.0, y:182.0, r:9.2,  o:0.5 },
  { x:115.7, y:191.6, r:19.0, o:0.5 },
];

const SCALE = 620 / 231;
const elStage = document.getElementById('canvasBox');
let delay = 0;

rawDots.forEach((d) => {
  const x = d.x * SCALE;
  const y = d.y * SCALE;
  const r = d.r * SCALE;
  const el = document.createElement('div');
  el.className = 'dot';
  el.style.left = (x - r) + 'px';
  el.style.top = (y - r) + 'px';
  el.style.width = (r*2) + 'px';
  el.style.height = (r*2) + 'px';
  el.style.opacity = d.o;
  el.style.animationDuration = (3 + Math.random()).toFixed(1) + 's';
  el.style.animationDelay = delay + 's';
  delay += 0.12;
  elStage.appendChild(el);
});

// Título posicionado no centro exato do espaço natural entre as duas fileiras centrais
const topGroupBottom = (77.4 + 19.5) * SCALE;
const bottomGroupTop = (134.6 - 19.5) * SCALE;
const bandCenter = (topGroupBottom + bottomGroupTop) / 2;

const h1 = document.createElement('h1');
h1.textContent = 'Hub Staff';
h1.style.top = (bandCenter - 12) + 'px';
elStage.appendChild(h1);
</script>

</body>
</html>
