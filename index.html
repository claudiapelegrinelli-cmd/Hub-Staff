<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WeClever - Capa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    font-family: 'Nunito', Arial, Helvetica, sans-serif;
  }
  #wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }
  #dots {
    position: relative;
    width: 785px;
    height: 720px;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
    animation: floaty 3s ease-in-out infinite;
    transition: transform 0.15s;
  }
  .dot.clickable {
    cursor: pointer;
    font-size: 22px;
    font-weight: 600;
    padding: 10px;
    text-decoration: none;
  }
  .dot.clickable:hover {
    transform: scale(1.08);
  }
  @keyframes floaty {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -22px; }
  }
</style>
</head>
<body>

<div id="wrapper">
  <div id="dots"></div>
</div>

<script>
/* ==========================================================
   INSTRUÇÕES:
   Troque cada "url: '#'" abaixo pelo link real da página
   correspondente no seu Google Sites antes de publicar.
   ========================================================== */

const dots = [
  { x:208.3, y:273.4, r:65.5, color:'#01A972', topic:'Sobre Nós',              url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/18e35suwTon3NKNZAHUoz7AkDXHQ90hlf/edit' },
  { x:399.7, y:273.4, r:65.7, color:'#01A972', topic:'Estrutura',              url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/1gyee1MjczRLJNfmNdDPTizVZYiLAiMiD/edit' },
  { x:591.1, y:273.4, r:65.7, color:'#01A972', topic:'Políticas e Compliance', url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/14D-gnr6EIeGVN-a5QBiET5WVNkaQdkxZ/edit' },
  { x:304.0, y:463.2, r:65.5, color:'#01A972', topic:'Pessoas',                url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/1hKc0KxPEdmBR1AxcR3SuPccs5jC4Ak61/edit' },
  { x:495.4, y:463.2, r:65.7, color:'#01A972', topic:'Redes Sociais',          url:'https://sites.google.com/d/1TNhDiV2vzM_0B8qfEvN6KxiQDmSy7FeO/p/1BFUI1XI5KVolZHxRhpVwIDcBaPZRp_eL/edit' },
];

const decorative = [
  { x:304.0, y:85.3,  r:65.3 },
  { x:495.4, y:85.3,  r:65.3 },
  { x:144.0, y:118.3, r:33.2 },
  { x:655.5, y:118.3, r:33.5 },
  { x:51.5,  y:306.4, r:31.5 },
  { x:751.1, y:306.4, r:33.2 },
  { x:112.6, y:463.2, r:65.3 },
  { x:686.8, y:463.2, r:65.3 },
  { x:239.6, y:618.3, r:33.2 },
  { x:559.7, y:618.3, r:33.3 },
  { x:399.7, y:651.3, r:65.0 },
];

const container = document.getElementById('dots');
let delay = 0;

function darkText(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b);
  return lum > 170 ? '#085041' : '#EAF6F1';
}

decorative.forEach((d) => {
  const el = document.createElement('div');
  el.className = 'dot';
  el.style.left = (d.x - d.r) + 'px';
  el.style.top = (d.y - d.r) + 'px';
  el.style.width = (d.r*2) + 'px';
  el.style.height = (d.r*2) + 'px';
  el.style.background = '#80D4B9';
  el.style.opacity = '0.5';
  el.style.animationDelay = delay + 's';
  delay += 0.15;
  container.appendChild(el);
});

dots.forEach((d) => {
  const el = document.createElement('a');
  el.href = d.url;
  el.className = 'dot clickable';
  el.setAttribute('aria-label', d.topic);
  el.style.left = (d.x - d.r) + 'px';
  el.style.top = (d.y - d.r) + 'px';
  el.style.width = (d.r*2) + 'px';
  el.style.height = (d.r*2) + 'px';
  el.style.background = d.color;
  el.style.color = '#B6FE80';
  el.style.animationDelay = delay + 's';
  delay += 0.15;
  el.textContent = d.topic;
  container.appendChild(el);
});
</script>

</body>
</html>
