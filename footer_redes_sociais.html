<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    font-family: 'Nunito', Arial, Helvetica, sans-serif;
  }
  #stage {
    padding: 48px 24px 56px;
    box-sizing: border-box;
  }
  #content {
    max-width: 1040px;
    margin: 0 auto;
  }
  .footer-title {
    color: #003F2E;
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    margin: 0 0 32px;
  }
  .footer-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }
  .company-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #01A972 0%, #00593E 100%);
    border-radius: 22px;
    padding: 28px 28px 26px;
    flex: 0 1 340px;
    box-sizing: border-box;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 63, 46, 0.12);
    margin: 0 60px;
  }
  .company-card::before {
    content: "";
    position: absolute;
    width: 160px;
    height: 160px;
    background: #B6FE80;
    opacity: 0.12;
    border-radius: 50%;
    top: -70px;
    right: -50px;
  }
  .company-name {
    position: relative;
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }
  .icon-row {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .icon-link {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.10);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
  }
  .icon-link:hover {
    transform: translateY(-6px) rotate(-8deg) scale(1.08);
    box-shadow: 0 10px 18px rgba(0,0,0,0.18);
  }
  .icon-link svg {
    width: 22px;
    height: 22px;
    fill: #FFFFFF;
  }
  .icon-site   { background: #B6FE80; }
  .icon-site svg { fill: #003F2E; }
  .icon-linkedin { background: #0A66C2; }
  .icon-instagram { background: radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
  .icon-x { background: #000000; }
  .icon-youtube { background: #FF0000; }

  @media (max-width: 700px) {
    .company-card {
      flex: 1 1 100%;
      margin: 0 0 20px;
    }
  }
</style>
</head>
